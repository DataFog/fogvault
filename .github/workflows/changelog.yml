name: Changelog
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
permissions:
  contents: read
jobs:
  changelog:
    name: Changelog policy / ${{ github.base_ref }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: pins
        run: node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("conformance/toolchains.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT,Object.entries(p).map(([k,v])=>k+"="+v+"\n").join(""));'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ steps.pins.outputs.python_ci }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - run: python scripts/quality.py check --profile policy --output-dir local-only/ci/policy
      - env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check-changelog.py --base "$PR_BASE" --head "$PR_HEAD" --event "$GITHUB_EVENT_PATH" --output local-only/ci/changelog.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: changelog-evidence
          path: local-only/ci/
          if-no-files-found: error
