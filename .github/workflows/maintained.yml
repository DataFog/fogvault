name: Maintained native and browser packages
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: cargo fmt --manifest-path crates/fogvault-native/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path crates/fogvault-native/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --locked --manifest-path crates/fogvault/Cargo.toml --no-default-features
      - run: python scripts/run-native-tests.py
      - run: cargo test --locked --manifest-path crates/fogvault-backup/Cargo.toml
      - run: python scripts/verify-maintained-api.py
  browser:
    name: Browser / ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chrome
          - os: ubuntu-24.04
            browser: firefox
          - os: windows-2025
            browser: msedge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '25.8.2'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: npm ci --ignore-scripts
        working-directory: packages/browser
      - if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
        working-directory: packages/browser
      - run: python scripts/verify-browser-sdk.py --engines ${{ matrix.browser }} --output local-only/ci/browser-sdk.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            local-only/ci/browser-sdk.json
            local-only/ci/browser-sdk.logs/

  extensions:
    name: Packaged browser extensions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '25.8.2'
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: npm ci --ignore-scripts
        working-directory: packages/browser
      - run: npx --no-install playwright install --with-deps chromium firefox
        working-directory: packages/browser
      - run: npm run build
        working-directory: packages/browser
      - run: npm run --silent test:extensions -- --reporter=json > extension-results.json
        working-directory: packages/browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: extension-results
          path: |
            packages/browser/extension-results.json
            packages/browser/test-results/
