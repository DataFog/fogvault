[package]
name = "fogvault-browser-feasibility"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[features]
default = ["diagnostics"]
diagnostics = []

[lib]
path = "../../crates/fogvault-wasm/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
fogvault = { path = "../../crates/fogvault", default-features = false, features = ["web"] }
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
zeroize = "=1.9.1"
sha2 = "=0.11.1"
fogvault-backup = { path = "../../crates/fogvault-backup" }
