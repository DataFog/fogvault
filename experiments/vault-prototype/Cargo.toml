[package]
name = "fogvault-disposable-prototype"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Disposable FogVault candidate-design experiment; not a production vault"

[features]
default = ["native"]
native = ["dep:rusqlite"]
web = ["fogvault/web"]

[dependencies]
fogvault = { path = "../../crates/fogvault", features = ["experimental-codecs"] }
zeroize = "=1.9.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks"], optional = true }

[dev-dependencies]
getrandom = "=0.4.3"
tempfile = "3"
datafog-core = { version = "=0.5.0-beta.3", default-features = false }

[[bin]]
name = "vault-prototype"
path = "src/main.rs"
required-features = ["native"]
