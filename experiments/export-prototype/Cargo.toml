[package]
name = "fogvault-export-feasibility"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Disposable bounded Rust age/export staging proof; not a maintained backend"

[dependencies]
age = { version = "=0.11.5", default-features = false }
sha2 = "=0.11.1"
zeroize = "=1.9.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"] }
