[package]
readme = "README.md"
repository = "https://github.com/DataFog/fogvault"
name = "fogvault"
version = "0.1.0"
edition = "2021"
publish = ["crates-io"]
license = "MIT"
description = "Portable FogVault lifecycle candidate; not production-qualified"

[features]
default = []
web = ["getrandom/wasm_js"]
experimental-codecs = []

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "=0.13.0"
hmac = { version = "=0.13.0", features = ["zeroize"] }
sha2 = "=0.11.1"
zeroize = "=1.9.1"
getrandom = "=0.4.3"
